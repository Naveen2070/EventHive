name: EventHive CI (Kotlin)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code
      - uses: actions/checkout@v4

      # 2. Set up JDK 21 (Required for Kotlin to run)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3. Grant execute permission for gradlew (CRITICAL for Linux CI)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Run Tests (Unit + Integration)
      # This automatically compiles your Kotlin code first
      - name: Test with Gradle
        run: ./gradlew test

