# ===========================
# Application Configuration
# ===========================
spring.application.name=EventHive

# ===========================
# Server Configuration
# ===========================
server.port=8080

# ===========================
# Datasource Configuration
# ===========================
spring.datasource.url=jdbc:postgresql://localhost:5432/eventhive_db
spring.datasource.username=postgres
spring.datasource.password=naveen2007
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================
# JPA / Hibernate Configuration
# ===========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# Liquibase Configuration
# ===========================
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# ===========================
# JWT Configuration
# ===========================
jwt.secret=your_super_secret_jwt_key_here
jwt.expiration-ms=3600000  # 1 hour in milliseconds

# ===========================
# Logging Configuration
# ===========================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE