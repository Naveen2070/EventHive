services:
  # 1. The Database
  db:
    image: postgres:17.7-alpine
    container_name: eventhive-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: eventhive
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d eventhive"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Your Application
  app:
    build: .
    container_name: eventhive-api
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/eventhive
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}

      RABBITMQ_HOST: hive-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: /
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET}
      IDENTITY_SERVICE_URL: http://localhost:8081

volumes:
  postgres_data: